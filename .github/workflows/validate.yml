name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  traceability:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to full commit SHAs; the tag is noted for review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit-test the validator
        run: python -m unittest discover -s tests -v
      - name: Validate traceability data
        run: python tools/validate_trace.py
      - name: Check generated doc views are current
        run: python tools/render_views.py --check
