name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  traceability:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to full commit SHAs; the tag is noted for review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit-test the validator
        run: python -m unittest discover -s tests -v
      - name: Validate traceability data
        run: python tools/validate_trace.py
      - name: Check generated doc views are current
        run: python tools/render_views.py --check
      - name: Check generated SysML model is current
        run: python tools/gen_sysml.py --check

  sysml:
    # Validates model/sysml with the OMG SysML v2 Pilot Implementation.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sysml
          # Key on the script, which pins the release, version and SHA-256.
          key: sysml-pilot-${{ hashFiles('tools/sysml/validate.sh') }}
      - name: Validate SysML v2 model
        run: tools/sysml/validate.sh

  brief:
    # Builds the PDR brief PDF with the toolchain pinned in brief/package-lock.json.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build the PDR brief
        env:
          CHROME_NO_SANDBOX: "1"
        run: CHROME_PATH="$(command -v google-chrome)" brief/build.sh
      - name: Check the brief's diagram sources match the docs
        run: git diff --exit-code -- 'brief/assets/*.mmd'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdr-brief
          path: brief/pdr-brief.pdf
          if-no-files-found: error
