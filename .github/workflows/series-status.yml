name: series-status

# Daily: fetch each series repo's series-status.json, check it against
# data/series.csv, regenerate the README series table, and open or update a
# PR on bot/series-status if anything changed. Uses only GITHUB_TOKEN.
# PRs opened with GITHUB_TOKEN do not trigger other workflows, so this job runs
# the checks itself before pushing.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: series-status
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Actions are pinned to full commit SHAs; the tag is noted for review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch series status files
        run: python tools/fetch_series_status.py
      - name: Check series status snapshots
        run: |
          shopt -s nullglob
          files=(data/series-status/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "No series status snapshots"; exit 0; fi
          python tools/check_series_status.py "${files[@]}"
      - name: Regenerate doc views
        run: python tools/render_views.py
      - name: Validate traceability data
        run: python tools/validate_trace.py
      - name: Open or update the PR
        # Only from main, so a dispatch from another branch can't retarget the bot PR.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/series-status
        run: |
          if [ -z "$(git status --porcelain -- data/series-status README.md)" ]; then
            echo "Series status unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A -- data/series-status README.md
          git commit -m "Refresh series status snapshots"
          gh auth setup-git
          git push --force origin "$BRANCH"
          open_pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number')
          if [ -z "$open_pr" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "Refresh series status snapshots" \
              --body "Generated by the series-status workflow (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID): fetched each series repo's series-status.json, checked it with tools/check_series_status.py, and regenerated the README series table."
          else
            echo "Updated PR #$open_pr on $BRANCH"
          fi
